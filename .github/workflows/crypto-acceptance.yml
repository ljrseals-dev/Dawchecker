name: Crypto acceptance gate

on:
  push:
    branches:
      - "repair/**"
    paths:
      - "CMakeLists.txt"
      - "src/core/ForensicHash.*"
      - "tests/EngineTests.cpp"
      - "Source/dawchecker_vst3.cpp"
      - "latest/dawchecker_vst3.cpp"
      - ".github/workflows/crypto-acceptance.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "src/core/ForensicHash.*"
      - "tests/EngineTests.cpp"
      - "Source/dawchecker_vst3.cpp"
      - "latest/dawchecker_vst3.cpp"
      - ".github/workflows/crypto-acceptance.yml"

permissions:
  contents: read

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libssl-dev
      - name: Configure with mandatory crypto gate
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDAWCHECKER_REQUIRE_CRYPTO=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Require at least one registered test
        run: ctest --test-dir build -N | grep -Eq 'Total Tests: [1-9][0-9]*'
      - name: Run engine and SHA-256 tests
        run: ctest --test-dir build --output-on-failure
